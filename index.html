<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資日誌筆記</title>
    <style>
        /* 基礎樣式 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #ffffff; color: #37352f; margin: 0; padding: 0; }
        .container { max-width: 1250px; margin: 0 auto; padding: 0 20px 50px 20px; }
        .cover-image { width: 100%; height: 220px; background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-position: center; border-radius: 0 0 12px 12px; }
        .header-title { font-size: 36px; font-weight: 700; margin: 30px 0 10px 0; border-bottom: 1px solid #ededed; padding-bottom: 15px; }
        .header-desc { font-size: 14px; color: #787774; margin-bottom: 30px; line-height: 1.6; }
        
        /* 佈局 */
        .main-layout { display: flex; gap: 30px; align-items: flex-start; }
        .sidebar { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; }
        .sidebar-box { padding: 15px; border-radius: 8px; font-size: 14px; }
        .box-yellow { background-color: #fcf9e3; }
        .box-gray { background-color: #f1f1f0; }
        .sidebar-box h4 { margin: 0 0 10px 0; display: flex; align-items: center; gap: 6px; font-size: 15px; }
        .sidebar-item { padding: 8px 5px; color: #37352f; display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 4px; transition: background 0.2s; }
        .sidebar-item:hover, .sidebar-item.active { background-color: rgba(0,0,0,0.08); }
        .content { flex: 1; min-width: 0; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        /* 表格共用設計 */
        .table-container { overflow-x: auto; margin-top: 10px; border: 1px solid #ededed; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        th, td { padding: 10px 12px; border-bottom: 1px solid #ededed; border-right: 1px solid #ededed; white-space: nowrap; }
        th { color: #787774; font-weight: normal; background: #fdfdfc; }
        td:last-child, th:last-child { border-right: none; }
        
        td input[type="text"], td input[type="number"], td input[type="date"], td select { border: none; background: transparent; width: 100%; font-size: 13px; outline: none; font-family: inherit; color: inherit; box-sizing: border-box; padding: 4px; border-radius: 4px; }
        td input:hover, td select:hover, td input:focus, td select:focus { background: #f1f1f0; }
        
        .btn-add { background: none; border: none; color: #787774; cursor: pointer; padding: 12px; display: flex; align-items: center; gap: 5px; font-size: 14px; width: 100%; text-align: left; }
        .btn-add:hover { background-color: #f1f1f0; color: #37352f; }
        .btn-delete { color: #999; background: none; border: none; cursor: pointer; border-radius: 4px; padding: 4px 8px; }
        .btn-delete:hover { background: #ffebee; color: #c62828; }
        
        /* 標籤設計 */
        .tag { padding: 2px 6px; border-radius: 4px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
        .tag-pink { background: #fce8e8; color: #9a3131; }
        .tag-green { background: #e6f4ea; color: #1e6235; }
        .tag-orange { background: #faebd7; color: #9c5b14; }
        .tag-gray { background: #e3e2e0; color: #32302c; }
        .tag-blue { background: #d3e5ef; color: #183347; }
        .profit { color: #d94228; }
        .loss { color: #438767; }

        /* 筆記區塊專用設計 */
        .note-form { background: #fdfdfc; border: 1px solid #ededed; border-radius: 8px; padding: 20px; margin-bottom: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .form-col { flex: 1; }
        .note-form label { display: block; font-size: 12px; font-weight: 600; color: #787774; margin-bottom: 6px; }
        .note-form input, .note-form select, .note-form textarea { width: 100%; padding: 8px 10px; border: 1px solid #e1e1e1; border-radius: 6px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
        .note-form textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
        .btn-submit { background: #37352f; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn-submit:hover { background: #2f2d27; }

        .note-card { border: 1px solid #ededed; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); background: #fff; }
        .note-header { margin-bottom: 15px; border-bottom: 1px solid #f1f1f0; padding-bottom: 15px; position: relative;}
        .note-title { font-size: 20px; font-weight: 700; margin: 0 0 10px 0; display: flex; align-items: center; gap: 8px; }
        .note-meta { display: flex; gap: 10px; font-size: 13px; color: #787774; align-items: center; }
        .note-body { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .note-section { margin-bottom: 15px; }
        .note-section h5 { margin: 0 0 8px 0; font-size: 14px; display: flex; align-items: center; gap: 6px; color: #37352f; }
        .note-section p { margin: 0; font-size: 14px; line-height: 1.6; color: #37352f; white-space: pre-wrap; }
        .btn-del-note { position: absolute; right: 0; top: 0; background: none; border: none; color: #ccc; cursor: pointer; font-size: 16px; }
        .btn-del-note:hover { color: #c62828; }
    </style>
</head>
<body>
    <div class="cover-image"></div>
    <div class="container">
        <div class="header-title">投資日誌筆記：個人資產管理&決策思考</div>
        <div class="header-desc">
            💡 客觀交叉查證台：拆解商業邏輯、緊盯毛利率底層數據。<br>
            ⚠️ 嚴守紀律：破線無條件出場，絕不預設立場。
        </div>

        <div class="main-layout">
            <!-- 左側邊欄 -->
            <div class="sidebar">
                <div class="sidebar-box box-yellow">
                    <h4>📁 資料庫</h4>
                    <div class="sidebar-item active" onclick="switchView('table')">🎯 投資標的&績效</div>
                    <div class="sidebar-item" onclick="switchView('trans')">☑️ 投資交易紀錄</div>
                    <div class="sidebar-item" onclick="switchView('notes')">🔖 投資分析&筆記</div>
                </div>
                <div class="sidebar-box box-gray">
                    <h4>📝 MEMO</h4>
                    <div style="font-size: 13px; color: #787774; margin-top: 5px;">不預設立場<br>短波段首重風控</div>
                </div>
            </div>

            <!-- 右側內容區 -->
            <div class="content">
                
                <!-- 視圖 1：投資標的表格 -->
                <div id="view-table" class="view-section active">
                    <div style="font-size: 22px; font-weight: 600; margin-bottom: 5px;">🎯 投資標的&績效</div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 80px;">◎ 市場</th>
                                    <th>Aa 標的名稱</th>
                                    <th>◎ 策略</th>
                                    <th>∑ 階段</th>
                                    <th>持有股/口數</th>
                                    <th>投入均價</th>
                                    <th>最新報價</th>
                                    <th>∑ 預估損益</th>
                                    <th style="width: 40px;"></th>
                                </tr>
                            </thead>
                            <tbody id="target-body"></tbody>
                        </table>
                        <button class="btn-add" onclick="addTargetRow()">+ 新增一筆標的</button>
                    </div>
                </div>

                <!-- 視圖 2：投資交易紀錄 -->
                <div id="view-trans" class="view-section">
                    <div style="font-size: 22px; font-weight: 600; margin-bottom: 5px;">☑️ 投資交易紀錄</div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 110px;">📅 交易日期</th>
                                    <th>↗ 標的</th>
                                    <th>◎ 交易類型</th>
                                    <th>◎ 買出/買入</th>
                                    <th>💸 股價</th>
                                    <th>📦 股數</th>
                                    <th>∑ 交易金額</th>
                                    <th style="width: 70px;">☑ 覆盤</th>
                                    <th>Aa 備註</th>
                                    <th style="width: 40px;">刪除</th>
                                </tr>
                            </thead>
                            <tbody id="trans-body"></tbody>
                        </table>
                        <button class="btn-add" onclick="addTransRow()">+ 新增一筆交易</button>
                    </div>
                </div>

                <!-- 視圖 3：投資分析與筆記 -->
                <div id="view-notes" class="view-section">
                    <div style="font-size: 22px; font-weight: 600; margin-bottom: 15px;">🔖 投資分析&筆記</div>
                    
                    <!-- 筆記輸入表單 -->
                    <div class="note-form">
                        <div class="form-row">
                            <div class="form-col" style="flex: 2;">
                                <label>Aa 報告標題</label>
                                <input type="text" id="note-title" placeholder="例如：PCB 族群大漲與精煉銅連動分析">
                            </div>
                            <div class="form-col">
                                <label>◎ 類別</label>
                                <select id="note-type">
                                    <option value="產業研報">產業研報</option>
                                    <option value="分析財報">分析財報</option>
                                    <option value="交易覆盤">交易覆盤</option>
                                    <option value="總經動向">總經動向</option>
                                </select>
                            </div>
                            <div class="form-col">
                                <label>↗ 關聯標的</label>
                                <input type="text" id="note-target" placeholder="例如：銅/PCB">
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label>🔍 核心關鍵摘要 (商業邏輯與毛利率觀察)</label>
                                <textarea id="note-summary" placeholder="紀錄報告中的重點數據與推演邏輯..."></textarea>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-col">
                                <label>⚠️ 投資風險與反向查證 (不預設立場)</label>
                                <textarea id="note-risk" placeholder="尋找潛在風險，例如 EPS 是否為一次性糖衣、是否存在產能過剩疑慮..."></textarea>
                            </div>
                            <div class="form-col">
                                <label>🎯 投資行動啟發 (短波段策略)</label>
                                <textarea id="note-action" placeholder="具體的應對策略、進場條件與停損設定..."></textarea>
                            </div>
                        </div>
                        <div style="text-align: right;">
                            <button class="btn-submit" onclick="saveNewNote()">儲存分析筆記</button>
                        </div>
                    </div>

                    <!-- 筆記列表渲染區 -->
                    <div id="notes-list"></div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- 資料初始化 ---
        let targets = JSON.parse(localStorage.getItem('trading_targets')) || [];
        let transactions = JSON.parse(localStorage.getItem('trading_trans')) || [];
        
        // 預設載入一筆符合你關注領域的交叉查證筆記範例
        let notes = JSON.parse(localStorage.getItem('trading_notes')) || [
            {
                id: Date.now(),
                date: '2026-04-07',
                title: '台股 PCB 族群大漲與大宗銅價連動性觀察',
                type: '產業研報',
                target: '銅 / PCB板塊',
                summary: '近期觀察到台股 PCB 族群大漲，底層邏輯推演這代表工業對銅的用量應該會越來越高。若需求面具備實質支撐，銅價有機會走出一波行情。',
                risk: '需客觀交叉查證：目前市場顯示「精煉銅產能過剩」的問題依然存在。要提防 PCB 廠近期的 EPS 成長是否只是短暫糖衣，若毛利率底層邏輯無法延續，產能過剩將反噬銅價走勢。',
                action: '身為短波段交易者，不可預設立場急於抄底。先將資金控管好，等待銅價確認消化過剩產能並突破壓力區間後再行試單，並嚴守破線無條件出場的紀律。'
            }
        ];

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        // ==========================================
        // 視圖 1 & 2：標的與交易紀錄 (保持原有邏輯)
        // ==========================================
        function renderTargets() {
            const tbody = document.getElementById('target-body');
            tbody.innerHTML = '';
            targets.forEach((item, index) => {
                const pnl = ((item.price - item.cost) * item.qty).toFixed(2);
                let pnlClass = item.qty > 0 ? (pnl > 0 ? 'profit' : (pnl < 0 ? 'loss' : '')) : '';
                tbody.innerHTML += `
                    <tr>
                        <td><select onchange="updateTarget(${index}, 'market', this.value)"><option value="台股" ${item.market==='台股'?'selected':''}>台股</option><option value="大宗" ${item.market==='大宗'?'selected':''}>大宗</option></select></td>
                        <td><input type="text" value="${item.name}" onchange="updateTarget(${index}, 'name', this.value)"></td>
                        <td><select onchange="updateTarget(${index}, 'strategy', this.value)"><option value="短波段" ${item.strategy==='短波段'?'selected':''}>短波段</option><option value="價值型" ${item.strategy==='價值型'?'selected':''}>價值型</option></select></td>
                        <td><select onchange="updateTarget(${index}, 'stage', this.value)"><option value="觀察中" ${item.stage==='觀察中'?'selected':''}>🔍 觀察中</option><option value="已佈局" ${item.stage==='已佈局'?'selected':''}>📈 已佈局</option></select></td>
                        <td><input type="number" value="${item.qty}" onchange="updateTarget(${index}, 'qty', this.value)"></td>
                        <td><input type="number" value="${item.cost}" onchange="updateTarget(${index}, 'cost', this.value)"></td>
                        <td><input type="number" value="${item.price}" onchange="updateTarget(${index}, 'price', this.value)"></td>
                        <td class="${pnlClass}" style="font-weight: 600;">${item.qty > 0 ? pnl : '-'}</td>
                        <td><button class="btn-delete" onclick="deleteTarget(${index})">🗑️</button></td>
                    </tr>`;
            });
        }
        function addTargetRow() { targets.push({ market: '台股', name: '', strategy: '短波段', stage: '觀察中', qty: 0, cost: 0, price: 0 }); saveTargets(); renderTargets(); }
        function updateTarget(index, field, value) { if(['qty', 'cost', 'price'].includes(field)) targets[index][field] = parseFloat(value) || 0; else targets[index][field] = value; saveTargets(); renderTargets(); }
        function deleteTarget(index) { if(confirm('確定刪除此標的？')) { targets.splice(index, 1); saveTargets(); renderTargets(); } }
        function saveTargets() { localStorage.setItem('trading_targets', JSON.stringify(targets)); }

        function renderTrans() {
            const tbody = document.getElementById('trans-body');
            tbody.innerHTML = '';
            transactions.forEach((item, index) => {
                let rawTotal = item.price * item.qty;
                let displayTotal = item.action === '買入' ? -Math.abs(rawTotal) : Math.abs(rawTotal);
                tbody.innerHTML += `
                    <tr>
                        <td><input type="date" value="${item.date}" onchange="updateTrans(${index}, 'date', this.value)"></td>
                        <td><input type="text" value="${item.target}" onchange="updateTrans(${index}, 'target', this.value)"></td>
                        <td><select onchange="updateTrans(${index}, 'type', this.value)"><option value="單筆申購" ${item.type==='單筆申購'?'selected':''}>單筆申購</option><option value="定期定額" ${item.type==='定期定額'?'selected':''}>定期定額</option></select></td>
                        <td><select class="tag ${item.action === '買入' ? 'tag-green' : 'tag-orange'}" style="appearance:none; text-align:center; cursor:pointer;" onchange="updateTrans(${index}, 'action', this.value)"><option value="買入" ${item.action==='買入'?'selected':''}>買入</option><option value="賣出" ${item.action==='賣出'?'selected':''}>賣出</option></select></td>
                        <td><input type="number" value="${item.price}" onchange="updateTrans(${index}, 'price', this.value)"></td>
                        <td><input type="number" value="${item.qty}" onchange="updateTrans(${index}, 'qty', this.value)"></td>
                        <td style="font-weight: 500;">$${displayTotal.toLocaleString()}</td>
                        <td style="text-align: center;"><input type="checkbox" ${item.reviewed ? 'checked' : ''} onchange="updateTrans(${index}, 'reviewed', this.checked)"></td>
                        <td><input type="text" value="${item.note}" onchange="updateTrans(${index}, 'note', this.value)"></td>
                        <td style="text-align: center;"><button class="btn-delete" onclick="deleteTrans(${index})">🗑️</button></td>
                    </tr>`;
            });
        }
        function addTransRow() { transactions.push({ date: new Date().toISOString().split('T')[0], target: '', type: '單筆申購', action: '買入', price: 0, qty: 0, reviewed: false, note: '' }); saveTrans(); renderTrans(); }
        function updateTrans(index, field, value) { if(['price', 'qty'].includes(field)) transactions[index][field] = parseFloat(value) || 0; else transactions[index][field] = value; saveTrans(); renderTrans(); }
        function deleteTrans(index) { if(confirm('確定刪除？')) { transactions.splice(index, 1); saveTrans(); renderTrans(); } }
        function saveTrans() { localStorage.setItem('trading_trans', JSON.stringify(transactions)); }

        // ==========================================
        // 視圖 3：投資分析與筆記
        // ==========================================
        function renderNotes() {
            const list = document.getElementById('notes-list');
            list.innerHTML = '';
            
            // 反轉陣列，讓最新新增的筆記顯示在最上方
            [...notes].reverse().forEach(note => {
                let typeTagColor = 'tag-blue';
                if(note.type === '交易覆盤') typeTagColor = 'tag-orange';
                if(note.type === '產業研報') typeTagColor = 'tag-green';
                
                list.innerHTML += `
                    <div class="note-card">
                        <div class="note-header">
                            <h3 class="note-title">📑 ${note.title}</h3>
                            <div class="note-meta">
                                <span class="tag ${typeTagColor}">${note.type}</span>
                                <span class="tag tag-gray">🎯 ${note.target}</span>
                                <span>🗓️ ${note.date}</span>
                            </div>
                            <button class="btn-del-note" onclick="deleteNote(${note.id})" title="刪除筆記">✖</button>
                        </div>
                        <div class="note-body">
                            <div>
                                <div class="note-section">
                                    <h5>🔍 核心關鍵摘要</h5>
                                    <p>${note.summary}</p>
                                </div>
                                <div class="note-section">
                                    <h5 style="color: #c62828;">⚠️ 投資風險與反向查證</h5>
                                    <p>${note.risk}</p>
                                </div>
                            </div>
                            <div style="background: #fdfdfc; padding: 15px; border-radius: 6px; border: 1px solid #f1f1f0; height: fit-content;">
                                <div class="note-section" style="margin-bottom: 0;">
                                    <h5 style="color: #1e6235;">🎯 投資行動啟發</h5>
                                    <p>${note.action}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function saveNewNote() {
            const title = document.getElementById('note-title').value;
            if(!title) { alert('請至少輸入報告標題！'); return; }

            const newNote = {
                id: Date.now(),
                date: new Date().toISOString().split('T')[0],
                title: title,
                type: document.getElementById('note-type').value,
                target: document.getElementById('note-target').value,
                summary: document.getElementById('note-summary').value,
                risk: document.getElementById('note-risk').value,
                action: document.getElementById('note-action').value
            };

            notes.push(newNote);
            localStorage.setItem('trading_notes', JSON.stringify(notes));
            
            // 清空表單
            document.getElementById('note-title').value = '';
            document.getElementById('note-target').value = '';
            document.getElementById('note-summary').value = '';
            document.getElementById('note-risk').value = '';
            document.getElementById('note-action').value = '';
            
            renderNotes();
        }

        function deleteNote(id) {
            if(confirm('確定要刪除這篇分析筆記嗎？')) {
                notes = notes.filter(n => n.id !== id);
                localStorage.setItem('trading_notes', JSON.stringify(notes));
                renderNotes();
            }
        }

        // 啟動渲染
        window.onload = () => { renderTargets(); renderTrans(); renderNotes(); };
    </script>
</body>
</html>
